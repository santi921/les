[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "les"
version = "0.1.0"
description = "Setup for LES"
readme = "README.md"
requires-python = ">=3.6"
authors = [
    {name = "Bingqing Cheng"}
]
dependencies = []
classifiers = []

[project.urls]
Homepage = "https://github.com/ChengUCB/les"

[project.scripts]
les = "les.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

